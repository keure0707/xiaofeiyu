name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Xiaofeiyu.xcodeproj \
            -scheme Xiaofeiyu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Xiaofeiyu.app Payload/
          /usr/bin/zip -r Xiaofeiyu.ipa Payload
          ls -lh Xiaofeiyu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xiaofeiyu-ipa
          path: Xiaofeiyu.ipa
          retention-days: 30
